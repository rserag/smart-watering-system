name: Production uptime

on:
  schedule:
    # Every ten minutes, offset from the top of the hour to reduce scheduler congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watering-production-uptime
  cancel-in-progress: true

jobs:
  monitor:
    name: External production check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe HTTPS, health, database, and Google login
        id: probe
        continue-on-error: true
        run: python3 monitoring/check_production.py
      - name: Open or resolve the production incident
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash monitoring/update_incident.sh "${{ steps.probe.outcome }}"
      - name: Mark the workflow failed
        if: steps.probe.outcome == 'failure'
        run: exit 1
